<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#0d1424;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1929;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffc03d;stop-opacity:0.9" />
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#ffc03d;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#ffc03d;stop-opacity:0" />
