<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#151b26;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e2638;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#9ca3af;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#d1d5db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b7280;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffc03d;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#e6ab30;stop-opacity:0.2" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.08" stroke="#ffc03d" stroke-width="0.5">
    <line x1="0" y1="30" x2="400" y2="30"/>
    <line x1="0" y1="60" x2="400" y2="60"/>
    <line x1="0" y1="90" x2="400" y2="90"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="0" y1="210" x2="400" y2="210"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="270" x2="400" y2="270"/>
    <line x1="40" y1="0" x2="40" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="160" y1="0" x2="160" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="240" y1="0" x2="240" y2="300"/>
    <line x1="280" y1="0" x2="280" y2="300"/>
    <line x1="320" y1="0" x2="320" y2="300"/>
    <line x1="360" y1="0" x2="360" y2="300"/>
  </g>

  <!-- Glow circle behind part -->
  <circle cx="200" cy="145" r="80" fill="url(#gold)" opacity="0.15"/>

  <!-- PISTON shape (center) -->
  <!-- Rod bottom -->
  <rect x="183" y="220" width="34" height="40" rx="4" fill="url(#metal)" stroke="#374151" stroke-width="1"/>
  <!-- Rod middle groove -->
  <rect x="186" y="195" width="28" height="30" rx="3" fill="url(#metal)" stroke="#374151" stroke-width="1"/>
  <!-- Main piston body -->
  <rect x="155" y="145" width="90" height="55" rx="8" fill="url(#metal)" stroke="#4b5563" stroke-width="1.5"/>
  <!-- Piston top dome -->
  <ellipse cx="200" cy="145" rx="45" ry="18" fill="url(#metal)" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Top face highlight -->
  <ellipse cx="200" cy="143" rx="38" ry="12" fill="#d1d5db" opacity="0.3"/>
  <!-- Horizontal grooves on body -->
  <rect x="155" y="163" width="90" height="4" rx="1" fill="#374151" opacity="0.6"/>
  <rect x="155" y="175" width="90" height="4" rx="1" fill="#374151" opacity="0.6"/>
  <rect x="155" y="187" width="90" height="4" rx="1" fill="#374151" opacity="0.6"/>
  <!-- Shimmer highlight on body -->
  <rect x="160" y="148" width="8" height="50" rx="3" fill="white" opacity="0.1"/>
  <!-- Rod highlight -->
  <rect x="186" y="197" width="5" height="26" rx="2" fill="white" opacity="0.12"/>
  <rect x="185" y="222" width="5" height="36" rx="2" fill="white" opacity="0.1"/>

  <!-- Gold accent ring on piston -->
  <ellipse cx="200" cy="200" rx="45" ry="5" fill="none" stroke="#ffc03d" stroke-width="1.5" opacity="0.5"/>

  <!-- FED badge bottom left -->
  <rect x="16" y="260" width="72" height="26" rx="6" fill="#ffc03d" opacity="0.15" stroke="#ffc03d" stroke-width="1" stroke-opacity="0.4"/>
  <text x="52" y="277" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffc03d" text-anchor="middle" letter-spacing="1">FED</text>

  <!-- Part type label top right -->
  <rect x="280" y="14" width="106" height="22" rx="5" fill="#243048" stroke="#374151" stroke-width="1"/>
  <text x="333" y="29" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#9ca3af" text-anchor="middle" letter-spacing="0.5">MINING PART</text>
</svg>
